name: Generate AWG Config
on:
  workflow_dispatch:
  schedule:
    - cron: '0 2 */3 * *'  # Каждые 3 дня в 02:00 MSK

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
    - name: 🧹 Удаляем старые запуски
      uses: Mattraks/delete-workflow-runs@v2
      with:
       token: ${{ secrets.GITHUB_TOKEN }}
       repository: ${{ github.repository }}
       retain_days: 0
       keep_minimum_runs: 1


  generate:
    needs: cleanup
    runs-on: ubuntu-latest
    steps:
      - name: 📥 Клонируем репозиторий
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: 📦 Устанавливаем зависимости
        run: |
          sudo apt-get update -yq
          sudo apt-get install -yq wireguard-tools jq curl

      - name: ⚙️ Генерируем конфиг AmneziaWG
        run: |
          chmod +x scripts/warp_generator.sh
          cd scripts
          bash warp_generator.sh
          
          sed -i \
            -e 's/^DNS = .*/DNS = 1.1.1.1,77.88.8.8,8.8.8.8/' \
            -e 's/^Address = .*/Address = 172.16.0.2\/32/' \
            -e 's/^Endpoint = \([^:]*\):[0-9]*/Endpoint = \1:4500/' \
            warp.conf
          
          cp -f warp.conf ../awg-primary.conf

      - name: 📤 Сохраняем обновления
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add awg-primary.conf
          git commit -m "🔄 Обновление AmneziaWG: порт 4500, $(date +%Y-%m-%d %H:%M)" || echo "ℹ️ Изменений нет"
          git push
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
