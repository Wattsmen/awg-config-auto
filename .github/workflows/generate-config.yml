name: Generate AmneziaWG Config
on:
  workflow_dispatch:
  schedule:
    - cron: '30 1 */3 * *'  # Каждые 3 дня в 01:30

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - name: Удаляем старые запуски, оставляя последний
        uses: Mattraks/delete-workflow-runs@v2
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          repository: ${{ github.repository }}
          retain_days: 0
          keep_minimum_runs: 1

  generate:
    needs: cleanup
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      
      - name: Устанавливаем зависимости
        run: |
          sudo apt-get update -y
          sudo apt-get install -y wireguard-tools jq curl
      
      - name: Генерируем Конфиг
        run: |
          chmod +x scripts/warp_generator.sh
          cd scripts
          bash warp_generator.sh
          
          sed -i \
            -e 's/^DNS = .*/DNS = 1.1.1.1, 1.0.0.1, 8.8.8.8, 77.88.8.8, 77.88.8.1/' \
            -e 's/^Address = .*/Address = 172.16.0.2\/32/' \
            warp.conf
          
          cp -f warp.conf ../awg-primary.conf
      
      - name: Сохраняем конфиг
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add awg-primary.conf
          git commit -m "Auto-update config $(date +%Y-%m-%d)" || echo "Нет изменений"
          git push
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
