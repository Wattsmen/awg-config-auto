name: Generate AmneziaWG Config
on:
  schedule:
    - cron: '0 0 * * *'
  workflow_dispatch:

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      
      - name: Устанавливаем зависимости
        run: |
          sudo apt-get update -y
          sudo apt-get install -y wireguard-tools jq curl
      
      - name: Запускаем генератор
        run: |
          chmod +x scripts/warp_generator.sh
          cd scripts && bash warp_generator.sh
          cp amneziawg.conf ../awg.conf
      
      - name: Сохраняем конфиг
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add awg.conf
          git commit -m "Auto-update config $(date +%Y-%m-%d)" || echo "Нет изменений"
          git push
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
